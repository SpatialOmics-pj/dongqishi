locale: "zh-CN"
site_theme: "default"
title: "Qishi Dong"
title_separator: "-"
name: &name "董其实 · Qishi Dong"
description: &description "Assistant Professor at Shenzhen Technology University working on statistical learning, biostatistics, spatial omics, and medical AI."
url: "https://spatialomics-pj.github.io"
baseurl: "/dongqishi"
repository: "SpatialOmics-pj/dongqishi"

# Academic Pages, pinned so upstream changes cannot unexpectedly alter the site.
remote_theme: "academicpages/academicpages.github.io@cccb41a7335dbec8354dfe7e8a79695aff4a3abe"

author:
  avatar: "avatar.jpg"
  name: *name
  bio: "深圳技术大学助理教授｜统计学习 · 生物统计 · 空间组学 · 医疗AI"
  location: "深圳，中国"
  employer: "深圳技术大学"
  email: "dongqishi@sztu.edu.cn"
  orcid: "https://orcid.org/0009-0005-6994-598X"
  github: "SpatialOmics-pj"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
atom_feed:
  hide: true

analytics:
  provider: "false"

include:
  - _pages

exclude:
  - .bundle
  - .github
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - node_modules
  - scripts
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
