name: Update publications

on:
  schedule:
    # Monday 09:17 China Standard Time (01:17 UTC).
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh publication metadata
        run: python scripts/update_publications.py

      - name: Commit changes
        run: |
          if git diff --quiet -- _publications; then
            echo "Publication list is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _publications
          git commit -m "chore: update publications from OpenAlex"
          git push
